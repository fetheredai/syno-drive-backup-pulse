name: build and publish

# Push to main -> tests run, then a multi-arch image is published to GHCR as
# :latest. Tag a release (v1.2.3) to also publish :1.2.3, :1.2 and :1.
# Pull requests build and test but never publish.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # ghcr.io/<owner>/<repo> — derived, so this workflow needs no editing.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run tests against the mock DSM
        run: python -m unittest tests -v

  publish:
    needs: test
    # Don't publish from pull requests — they run on untrusted code.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 layer too. Synology "plus"
      # models are Intel/AMD; the value models are ARM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the value to put in .env on each NAS
        run: |
          echo "### Deploy" >> $GITHUB_STEP_SUMMARY
          echo "Put this in \`.env\` on each NAS:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "PULSE_IMAGE=${IMAGE,,}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "First publish only: make the package public at" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          echo "-> Package settings -> Change visibility -> Public," >> $GITHUB_STEP_SUMMARY
          echo "so client NASes can pull without credentials." >> $GITHUB_STEP_SUMMARY
